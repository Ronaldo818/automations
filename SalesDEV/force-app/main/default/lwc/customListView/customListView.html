<template>
    
    <template if:true={loadingTable}>
        <div>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>
    
    <div class="slds-grid slds-grid_align-spread">
        
            <div class="slds-col slds-size_1-of-3 slds-var-m-bottom_small" if:false={isOrder}>
                <template if:false={showEmptyText}>
                    <lightning-input type="text" label="Pesquisa"   onchange={handleChangeFilter}></lightning-input>
                </template>
            </div>
            <div class="slds-col slds-size_2-of-3 slds-var-m-bottom_small" if:true={isOrder}>
                <template if:false={showEmptyText}>
                <lightning-input type="text" label="Pesquisa" onchange={handlePesquisaValue}  ></lightning-input>
                <lightning-button label="Pesquisar" onclick={handleChangeFilter}></lightning-button>
            </template>
            </div>
        
        <div>
            <slot name="Extra-Space"></slot>
        </div>
    </div>

    <template lwc:if={showEmptyText}>
        <h1 class="custom-empty-message">{emptyMessage}</h1>
    </template>
    <template lwc:else>
        <template if:false={enablequickactions}>
            <div style="height: 800px; margin-bottom: 100px;">
                <lightning-datatable
                        key-field="id"
                        data={data}
                        class="slds-max-medium-table_stacked"
                        row-number-offset={rowOffset}
                        hide-checkbox-column
                        columns={columns}
                        default-sort-direction={defaultSortDirection}
                        sorted-direction={sortDirection}
                        sorted-by={sortedBy}
                        onsort={onHandleSort}>
                </lightning-datatable>
                <template lwc:if={showLoadMore}>
                    <lightning-button 
                        variant="base"
                        label="Carregar mais" 
                        onclick={handleLoadMore} 
                    ></lightning-button>
                </template>
            </div>
        </template>
    </template>

    <template if:true={showRecordPage}>
        <section aria-modal="true" class="slds-modal slds-fade-in-open" style="width:100%;">
            <div class="slds-modal__container modal_container_custom">
                <lightning-icon class="slds-modal__close slds-float_right custom-color" icon-name="utility:close" size="small" style="color:white" onclick={closeRecordPage} ></lightning-icon>
                <template if:false={loaded}>
                    <div>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </div>
                </template>
                <div class="slds-modal__content modal_content_custom">
                    <iframe src={linkRecordPage} frameborder="0" scrolling="yes" width="100%" height="500px" data-id="iFrameRecordPage" onload={stopSpinner}></iframe>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
