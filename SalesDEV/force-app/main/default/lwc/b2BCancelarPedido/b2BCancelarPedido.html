<template>

    <div if:true={isLoading}>
        <lightning-spinner></lightning-spinner>    
    </div>

    <div style="display: flex; justify-content: end; align-items: center;">
        <button class="slds-button slds-button_brand slds-m-around_xx-small slds-text-align_center" onclick={cancelOrder}>Cancelar Pedido</button>
    </div>

    <div if:true={showAlert}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Meaningful description of the modal content" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__content slds-p-around_medium slds-modal__content_headless" id="modal-content-id-1">
                    <span style="text-align: center; padding: 1%;">
                        <p> {alertMesage} </p>
                        <div if:true={comercialNumber}>
                            <br>
                            <p> Número para contato: <strong>{comercialNumber}</strong></p>
                        </div>
                    </span>
                    <div style="display: flex; align-items: center; justify-content: center; margin: 1%;">
                        <button class="slds-button slds-button_brand" onclick={closeAlert} >OK</button>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </div>

</template>
