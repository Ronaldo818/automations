<template>
    <div class="container-card">

        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Carregando" size="medium"></lightning-spinner>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- Tela de Sucesso -->
        <template lwc:if={showSuccess}>
            <div class="container-center-body">
                <h3 class="slds-text-align_center slds-p-vertical_small">
                    <lightning-icon icon-name="action:approval" alternative-text="Sucesso" title="Sucesso"></lightning-icon>
                </h3>
                <h3 class="slds-text-align_center slds-p-vertical_small">Revisão cadastral enviada com sucesso!</h3>
                <lightning-button label="Nova Revisão" variant="brand" onclick={handleReset} class="slds-m-around_medium"></lightning-button>
            </div>
        </template>

        <!-- Formulário -->
        <template lwc:else>

            <div class="slds-section__title slds-theme_shade slds-m-bottom_small slds-p-horizontal_small header-title">
                <span>REVISÃO CADASTRAL</span>
            </div>

            <!-- Cliente (busca por CNPJ ou CPF) -->
            <div class="slds-section__title slds-theme_shade slds-m-bottom_small slds-p-horizontal_small">
                <span>Cliente</span>
            </div>
            <div class="slds-m-bottom_large">
                <div class="slds-form__row slds-var-p-horizontal_medium slds-m-bottom_small">
                    <div class="slds-form__item">
                        <div class="slds-size_12-of-12">
                            <fieldset class="slds-form-element">
                                <legend class="slds-form-element__legend slds-form-element__label">Tipo de Pessoa</legend>
                                <div class="slds-form-element__control tipo-pessoa-options">
                                    <lightning-input
                                        type="checkbox"
                                        label="Pessoa Jurídica"
                                        data-tipo="PJ"
                                        checked={isPJ}
                                        onchange={handleTipoPessoaChange}>
                                    </lightning-input>
                                    <lightning-input
                                        type="checkbox"
                                        label="Pessoa Física"
                                        data-tipo="PF"
                                        checked={isPF}
                                        onchange={handleTipoPessoaChange}>
                                    </lightning-input>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>

                <div class="slds-form__row slds-var-p-horizontal_medium">
                    <div class="slds-form__item">
                        <div class="slds-size_12-of-12">
                            <template lwc:if={isPJ}>
                                <lightning-input required
                                    type="text"
                                    data-id="inputCNPJ"
                                    field-api-name="Cnpj__c"
                                    label="CNPJ"
                                    max-length="18"
                                    onchange={handleChangeCnpj}>
                                </lightning-input>
                            </template>
                            <template lwc:else>
                                <lightning-input required
                                    type="text"
                                    data-id="inputCPF"
                                    field-api-name="CPF__c"
                                    label="CPF"
                                    max-length="14"
                                    onchange={handleChangeCpf}>
                                </lightning-input>
                            </template>
                        </div>
                    </div>
                </div>

                <template lwc:if={isSearchingConta}>
                    <div class="slds-var-p-horizontal_medium slds-p-vertical_x-small slds-grid slds-grid_vertical-align-center">
                        <lightning-spinner alternative-text="Buscando" size="x-small" class="slds-m-right_x-small"></lightning-spinner>
                        <span class="slds-text-body_small slds-m-left_medium">Buscando conta...</span>
                    </div>
                </template>

                <template lwc:if={contaNome}>
                    <div class="slds-var-p-horizontal_medium slds-p-vertical_x-small">
                        <div class="slds-box slds-box_x-small slds-theme_success">
                            <lightning-icon icon-name="utility:check" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span class="slds-text-body_regular"><strong>{contaNome}</strong></span>
                        </div>
                    </div>
                </template>

                <template lwc:if={contaNotFound}>
                    <div class="slds-var-p-horizontal_medium slds-p-vertical_x-small">
                        <div class="slds-box slds-box_x-small slds-theme_warning">
                            <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <template lwc:if={isPJ}>
                                <span class="slds-text-body_regular">Nenhuma conta encontrada para este CNPJ</span>
                            </template>
                            <template lwc:else>
                                <span class="slds-text-body_regular">Nenhuma conta encontrada para este CPF</span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- CNPJ, Telefone, Email -->
            <div class="slds-section__title slds-theme_shade slds-m-bottom_small slds-p-horizontal_small">
                <span>Dados do Cliente</span>
            </div>
            <div class="slds-m-bottom_large">
                <div class="slds-form__row slds-var-p-horizontal_medium">
                    <div class="slds-form__item">
                        <div class="slds-size_12-of-12">
                            <lightning-input
                                type="text"
                                lwc:ref="inputTelefone"
                                field-api-name="Telefone__c"
                                label="Telefone"
                                min-length="14"
                                max-length="15"
                                onchange={handleChangeTelefone}>
                            </lightning-input>
                        </div>
                    </div>
                    <div class="slds-form__item">
                        <div class="slds-size_12-of-12">
                            <lightning-input
                                type="text"
                                lwc:ref="inputEmail"
                                field-api-name="Email__c"
                                label="Email"
                                max-length="255"
                                onchange={handleChangeEmail}>
                            </lightning-input>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tipo de Revisão (Multi-Select via Checkboxes) -->
            <div class="slds-m-bottom_large">
                <div class="slds-form__row slds-var-p-horizontal_medium">
                    <div class="slds-form__item">
                        <div class="slds-size_12-of-12">
                            <fieldset class="slds-form-element">
                                <legend class="slds-form-element__legend slds-form-element__label">
                                    <abbr class="slds-required" title="required">*</abbr>
                                    Tipo de Revisão
                                </legend>
                                <div class="slds-form-element__control tipo-revisao-grid">
                                    <template for:each={tipoRevisaoOptions} for:item="option">
                                        <div class="slds-checkbox slds-p-bottom_xx-small" key={option.value}>
                                            <input
                                                type="checkbox"
                                                name="tipoRevisao"
                                                id={option.value}
                                                value={option.value}
                                                onchange={handleTipoRevisaoChange}
                                            />
                                            <label class="slds-checkbox__label" for={option.value}>
                                                <span class="slds-checkbox_faux"></span>
                                                <span class="slds-form-element__label">{option.label}</span>
                                            </label>
                                        </div>
                                    </template>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Comentários -->
            <div class="slds-m-bottom_large">
                <div class="slds-form__row slds-var-p-horizontal_medium">
                    <div class="slds-form__item">
                        <div class="slds-size_12-of-12">
                            <lightning-textarea
                                lwc:ref="inputComentarios"
                                field-api-name="Comentarios__c"
                                label="Comentários"
                                max-length="32768">
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Anexos -->
            <div class="slds-m-bottom_large">
                <div class="slds-form__row slds-var-p-horizontal_medium">
                    <div class="slds-form__item">
                        <div class="slds-size_12-of-12">
                            <label class="slds-form-element__label">Anexos (opcional)</label>
                            <div class="file-upload-area slds-p-around_small slds-m-top_xx-small">
                                <lightning-input
                                    type="file"
                                    label=""
                                    variant="label-hidden"
                                    multiple
                                    accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx"
                                    onchange={handleFileChange}>
                                </lightning-input>

                                <template lwc:if={hasFiles}>
                                    <div class="slds-m-top_small">
                                        <p class="slds-text-body_small slds-m-bottom_xx-small"><strong>Arquivos selecionados:</strong></p>
                                        <template for:each={uploadedFiles} for:item="file">
                                            <div class="slds-grid slds-grid_vertical-align-center slds-p-vertical_xx-small file-item" key={file.name}>
                                                <lightning-icon icon-name="doctype:attachment" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                                <span class="slds-text-body_small slds-truncate">{file.name}</span>
                                                <lightning-button-icon
                                                    icon-name="utility:close"
                                                    variant="bare"
                                                    size="small"
                                                    alternative-text="Remover"
                                                    data-name={file.name}
                                                    onclick={handleRemoveFile}
                                                    class="slds-m-left_x-small">
                                                </lightning-button-icon>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer / Ações -->
            <div class="container-footer slds-var-p-horizontal_medium slds-p-top_medium">
                <lightning-button
                    label="Cancelar"
                    variant="neutral"
                    class="slds-var-m-around_small"
                    onclick={handleReset}>
                </lightning-button>
                <lightning-button
                    label="Enviar ao Setor de Cadastro"
                    variant="brand"
                    class="slds-var-m-around_small"
                    icon-name="utility:check"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>

        </template>

    </div>
</template>
